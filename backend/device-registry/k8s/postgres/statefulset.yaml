apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: device-registry-db
spec:
  serviceName: device-registry-db
  replicas: 1
  selector:
    matchLabels:
      app: device-registry-db
  template:
    metadata:
      labels:
        app: device-registry-db
    spec:
      containers:
        - name: device-registry-db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: device-registry-db-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: device-registry-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: device-registry-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

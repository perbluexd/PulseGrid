spring:
  application:
    name: device-registry
  datasource:
    url: jdbc:postgresql://localhost:5440/device_registry_db
    username: device_registry_user
    password: device_registry_pass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-placeholder-never-use-in-production}
    access-token-expiration-minutes: 30
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:dev-only-internal-placeholder-never-use-in-production}
  kafka:
    device-registry-events-topic: device-registry-events

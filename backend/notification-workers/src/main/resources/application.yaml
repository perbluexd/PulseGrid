spring:
  application:
    name: notification-workers
  datasource:
    url: jdbc:postgresql://localhost:5443/notification_workers_db
    username: notification_workers_user
    password: notification_workers_pass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pulsegrid}
    password: ${RABBITMQ_PASSWORD:pulsegrid}
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8094

app:
  notifications:
    email:
      from: ${NOTIFICATIONS_EMAIL_FROM:alerts@pulsegrid.local}
      to: ${NOTIFICATIONS_EMAIL_TO:ops-team@pulsegrid.local}
  rabbitmq:
    alert-notifications:
      queue: alert-notifications
      dead-letter-exchange: alert-notifications.dlx
      dead-letter-queue: alert-notifications.dlq

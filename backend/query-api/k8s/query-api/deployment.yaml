apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  labels:
    app: query-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query-api
  template:
    metadata:
      labels:
        app: query-api
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: query-api
          image: docker.io/perblue/query-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8095
          envFrom:
            - configMapRef:
                name: query-api-config
            - secretRef:
                name: query-api-secret
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3

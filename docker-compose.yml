services:
  device-registry-db:
    image: postgres:16-alpine
    container_name: pulsegrid-device-registry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: device_registry_db
      POSTGRES_USER: device_registry_user
      POSTGRES_PASSWORD: device_registry_pass
    ports:
      - "5440:5432"
    volumes:
      - device_registry_db_data:/var/lib/postgresql/data

  device-registry:
    build:
      context: ./backend/device-registry
    container_name: pulsegrid-device-registry
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://device-registry-db:5432/device_registry_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      device-registry-db:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  aggregation-service-db:
    image: timescale/timescaledb:latest-pg16
    container_name: pulsegrid-aggregation-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aggregation_service_db
      POSTGRES_USER: aggregation_service_user
      POSTGRES_PASSWORD: aggregation_service_pass
    ports:
      - "5441:5432"
    volumes:
      - aggregation_service_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregation_service_user -d aggregation_service_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  aggregation-service:
    build:
      context: ./backend/aggregation-service
    container_name: pulsegrid-aggregation-service
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://aggregation-service-db:5432/aggregation_service_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      aggregation-service-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  alerting-service-db:
    image: postgres:16-alpine
    container_name: pulsegrid-alerting-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: alerting_service_db
      POSTGRES_USER: alerting_service_user
      POSTGRES_PASSWORD: alerting_service_pass
    ports:
      - "5442:5432"
    volumes:
      - alerting_service_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerting_service_user -d alerting_service_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  alerting-service:
    build:
      context: ./backend/alerting-service
    container_name: pulsegrid-alerting-service
    restart: unless-stopped
    ports:
      - "8093:8093"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://alerting-service-db:5432/alerting_service_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      DEVICE_REGISTRY_BASE_URL: http://device-registry:8090
    depends_on:
      alerting-service-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      device-registry:
        condition: service_started

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: pulsegrid-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pulsegrid
      RABBITMQ_DEFAULT_PASS: pulsegrid
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: pulsegrid-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: pulsegrid-kafka-init
    restart: "no"
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        TOPICS=/opt/kafka/bin/kafka-topics.sh
        BS=kafka:9092
        until $$TOPICS --bootstrap-server $$BS --list > /dev/null 2>&1; do sleep 2; done
        ensure_topic() {
          $$TOPICS --bootstrap-server $$BS --create --if-not-exists --topic $$1 --partitions $$2 --replication-factor 1
          CURRENT=$$($$TOPICS --bootstrap-server $$BS --describe --topic $$1 | grep -c 'Partition: ')
          if [ "$$CURRENT" -lt "$$2" ]; then
            $$TOPICS --bootstrap-server $$BS --alter --topic $$1 --partitions $$2
          fi
        }
        ensure_topic telemetry-events 3
        ensure_topic device-registry-events 1

  redis:
    image: redis:7-alpine
    container_name: pulsegrid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  ingestion-gateway:
    build:
      context: ./backend/ingestion-gateway
    container_name: pulsegrid-ingestion-gateway
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEVICE_REGISTRY_BASE_URL: http://device-registry:8090
    depends_on:
      device-registry:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  device_registry_db_data:
  aggregation_service_db_data:
  alerting_service_db_data:
  rabbitmq_data:
